name: Release

# Tags are the release trigger, so what shipped is always reconstructable from
# the tag alone. workflow_dispatch exists for re-cutting an image without
# moving a tag.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Which NEXT_PUBLIC_* build inputs to bake in
        required: true
        default: production
        type: choice
        options: [production, staging]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/kuwana
  IMAGE_MIGRATE: ghcr.io/${{ github.repository_owner }}/kuwana-migrate

jobs:
  publish:
    name: Build, sign and push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    permissions:
      contents: read
      packages: write
      # Required for cosign's keyless (OIDC) signing — no private key is
      # stored anywhere; the signature is bound to this workflow's identity
      # and recorded in the public Rekor transparency log.
      id-token: write
    outputs:
      web-digest: ${{ steps.build-web.outputs.digest }}
      migrate-digest: ${{ steps.build-migrate.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_WEB }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Derive migrator tags
        id: meta-migrate
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_MIGRATE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Auth.js and MinIO config are runtime-only env now (see Dockerfile) —
      # unlike the old NEXT_PUBLIC_SUPABASE_* build args they replace, the
      # same image built here can run against any environment's cluster
      # config, so there is nothing environment-specific left to pass as a
      # build-arg besides the version stamp.
      - name: Build and push web image
        id: build-web
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrator image
        id: build-migrate
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign images
        run: |
          cosign sign --yes "${IMAGE_WEB}@${WEB_DIGEST}"
          cosign sign --yes "${IMAGE_MIGRATE}@${MIGRATE_DIGEST}"
        env:
          IMAGE_WEB: ${{ env.IMAGE_WEB }}
          IMAGE_MIGRATE: ${{ env.IMAGE_MIGRATE }}
          WEB_DIGEST: ${{ steps.build-web.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.build-migrate.outputs.digest }}

      - name: Scan the published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_WEB }}@${{ steps.build-web.outputs.digest }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Summary
        run: |
          {
            echo "### Published"
            echo ""
            echo '```'
            echo "${IMAGE_WEB}@${WEB_DIGEST}"
            echo "${IMAGE_MIGRATE}@${MIGRATE_DIGEST}"
            echo '```'
            echo ""
            echo "Deploy with the digests above, not a tag — a tag can be moved, a digest cannot."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE_WEB: ${{ env.IMAGE_WEB }}
          IMAGE_MIGRATE: ${{ env.IMAGE_MIGRATE }}
          WEB_DIGEST: ${{ steps.build-web.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.build-migrate.outputs.digest }}

  chart:
    name: Package Helm chart
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Push chart to GHCR as an OCI artifact
        run: |
          helm registry login ${{ env.REGISTRY }} \
            -u ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }}
          # Chart version and appVersion are pinned to the tag so a chart
          # revision can always be traced back to the images it deploys.
          version="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/kuwana \
            --version "${version:-0.0.0-dev}" \
            --app-version "${version:-0.0.0-dev}"
          helm push "kuwana-${version:-0.0.0-dev}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"
