name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  verify:
    name: Lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # The generated Prisma client is a type dependency of half the codebase,
      # so this has to happen before tsc, not before the build.
      #
      # DIRECT_URL is a syntactic placeholder, not a reachable database.
      # prisma.config.ts resolves it eagerly via `env("DIRECT_URL")` when the
      # CLI loads its config, so *every* prisma command needs it present —
      # including `generate`, which never opens a connection. Without it this
      # step fails with "PrismaConfigEnvError: Cannot resolve environment
      # variable: DIRECT_URL" and takes the typecheck and lint steps below
      # down with it.
      - run: npx prisma generate
        env:
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
