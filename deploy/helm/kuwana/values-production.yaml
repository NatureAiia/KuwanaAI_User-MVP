# Production overlay.
#
# Target architecture: a single privately-hosted VPS running k3s, not a
# multi-node autoscaled cluster. Database is the in-cluster Postgres
# (postgresql.enabled=true, the chart default — not overridden here so this
# file doesn't drift from it) and storage is the in-cluster MinIO
# (minio.enabled=true, also the chart default). Nothing here points at a
# managed external service; everything stateful lives on this one box.
#
#   helm upgrade --install kuwana deploy/helm/kuwana \
#     -n kuwana --create-namespace \
#     -f deploy/helm/kuwana/values-production.yaml \
#     --set image.digest=sha256:<digest> \
#     --set migrations.image.digest=sha256:<digest> \
#     --atomic --timeout 10m

# replicaCount/autoscaling/podDisruptionBudget/topologySpreadConstraints are
# all left at the chart default (1 replica, autoscaling off, PDB off, no
# spread constraints) rather than overridden here — restating them would just
# repeat values.yaml and invite the two files drifting apart. See values.yaml
# for the single-node reasoning behind each. Re-enable them here explicitly
# the day this moves off one box.

resources:
  requests:
    cpu: 500m
    memory: 768Mi
  limits:
    memory: 1536Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Edge-level flood control, kept as a second and independent limit now
    # that src/lib/rateLimit.ts counts in the shared store. This one also
    # covers traffic that never reaches a pod, and still applies if the store
    # is unreachable and the app falls back to per-replica counting.
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
  hosts:
    - host: kuwana.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: kuwana-tls
      hosts:
        - kuwana.example.com

config:
  adminEmails: "arthur@rubiem.com"
  # minioEndpoint deliberately unset: it defaults to this release's in-cluster
  # MinIO Service (see configmap.yaml) rather than to a hand-written hostname
  # that would need to be kept in sync with whatever the release is named.
  minioBucket: "kuwana"
  # The public S3 Ingress hostname below (minio.ingress.hosts) — this is what
  # browsers actually fetch listing images from.
  minioPublicUrl: "https://storage.kuwana.example.com"

# Vault-backed, via the External Secrets Operator. Nothing sensitive is ever
# written into this file or into the release's stored values. MinIO's root
# credentials are NOT listed here: with minio.enabled=true (the chart
# default, not overridden below) minio.yaml generates and owns them, the same
# way postgresql.enabled owns DATABASE_URL — there is nothing for Vault to
# hold for either.
externalSecret:
  enabled: true
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshInterval: 1h
  data:
    - secretKey: AUTH_SECRET
      remoteRef:
        key: kuwana/production
        property: auth_secret
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: kuwana/production
        property: anthropic_api_key
    - secretKey: CRON_SECRET
      remoteRef:
        key: kuwana/production
        property: cron_secret

# database.connectionLimit/poolTimeout are left at the chart default too: that
# default was already sized per-pod for the in-cluster Postgres (see
# values.yaml), and the render-time budget check in _helpers.tpl verifies it
# against postgresql.maxConnections directly — there is no managed pooler
# (pgBouncer/port 6543) in this architecture to route around, unlike the
# Supabase-backed setup this file used to describe.

# On, and not optional at replicaCount 1 either: see the reasoning in
# values.yaml. Restated here with production-sized limits.
valkey:
  enabled: true
  maxmemory: 768mb
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

migrations:
  enabled: true
  # One attempt. A migration that failed halfway is a situation for a human to
  # look at, not for Kubernetes to retry into a worse state.
  backoffLimit: 0

cronJobs:
  enabled: true

networkPolicy:
  enabled: true
  ingressNamespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: ingress-nginx

# minio.enabled stays at the chart default (true) — restated here only to
# override the public S3 Ingress hostname and give it a real TLS secret name.
minio:
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: storage.kuwana.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: kuwana-minio-tls
        hosts:
          - storage.kuwana.example.com
