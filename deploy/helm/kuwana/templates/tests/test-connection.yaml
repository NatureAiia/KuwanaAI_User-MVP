apiVersion: v1
kind: Pod
metadata:
  name: {{ include "kuwana.fullname" . }}-test
  labels:
    {{- include "kuwana.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: probe
      image: {{ .Values.cronJobs.image }}
      securityContext:
        {{- toYaml .Values.containerSecurityContext | nindent 8 }}
      command:
        - sh
        - -c
        - |
          set -eu
          base="http://{{ include "kuwana.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
          # Readiness is the meaningful assertion: it proves the pod reached
          # its database and has complete config, not merely that it answers.
          curl --fail --show-error --silent --max-time 10 "$base/api/health"
          curl --fail --show-error --silent --max-time 10 "$base/api/health/ready"
          echo "OK"
