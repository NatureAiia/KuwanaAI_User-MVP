{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kuwana.serviceAccountName" . }}
  labels:
    {{- include "kuwana.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No Role or RoleBinding accompanies this account on purpose: the application
# never talks to the Kubernetes API, so it gets no permissions and no mounted
# token.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
