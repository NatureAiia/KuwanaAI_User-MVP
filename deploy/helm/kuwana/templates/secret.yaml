{{- if .Values.secrets.create }}
# Development / evaluation only.
#
# Values rendered here come from a values file, which means they exist in
# plaintext in Git history, in `helm get values`, and in every CI log that
# echoes the command. Production installs should use externalSecret.enabled
# (External Secrets Operator) or existingSecret (sealed-secrets / SOPS).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kuwana.fullname" . }}
  labels:
    {{- include "kuwana.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.postgresql.enabled }}
  DATABASE_URL: {{ required "secrets.databaseUrl is required unless postgresql.enabled=true" .Values.secrets.databaseUrl | quote }}
  {{- end }}
  AUTH_SECRET: {{ required "secrets.authSecret is required" .Values.secrets.authSecret | quote }}
  {{- if not .Values.minio.enabled }}
  MINIO_ACCESS_KEY: {{ required "secrets.minioAccessKey is required unless minio.enabled=true" .Values.secrets.minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ required "secrets.minioSecretKey is required unless minio.enabled=true" .Values.secrets.minioSecretKey | quote }}
  {{- end }}
  ANTHROPIC_API_KEY: {{ required "secrets.anthropicApiKey is required" .Values.secrets.anthropicApiKey | quote }}
  # Shared bearer token the CronJobs present to /api/cron/*. Generated on
  # first install and then held stable across upgrades by reading the existing
  # Secret back — regenerating it every upgrade would break every scheduled
  # job until the next rollout caught up.
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (include "kuwana.fullname" .) }}
  {{- $current := "" }}
  {{- if and $existing $existing.data (hasKey $existing.data "CRON_SECRET") }}
  {{- $current = index $existing.data "CRON_SECRET" | b64dec }}
  {{- end }}
  CRON_SECRET: {{ default (default (randAlphaNum 48) $current) .Values.secrets.cronSecret | quote }}
  {{- /*
    Optional rather than `required`, because each one gates a feature rather
    than the app booting: without them the app starts and serves, and only the
    dependent feature fails. Marking them required would block every install
    that does not use payments or scraping.

    They are emitted only when set so an unset value does not overwrite a key
    supplied some other way with an empty string — which would turn "not
    configured" into "configured as blank", a much harder failure to read.
  */}}
  {{- with .Values.secrets.openrouterApiKey }}
  OPENROUTER_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.firecrawlApiKey }}
  FIRECRAWL_API_KEY: {{ . | quote }}
  {{- end }}
  {{- /*
    Paynow issues a separate merchant integration per settlement currency, so
    the USD and ZiG pairs are independent — see getCredentials() in
    src/lib/paynow.ts, which throws PaynowNotConfiguredError for whichever
    currency is missing. A deploy with neither pair set cannot credit a single
    wallet top-up.
  */}}
  {{- with .Values.secrets.paynowIntegrationId }}
  PAYNOW_INTEGRATION_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.paynowIntegrationKey }}
  PAYNOW_INTEGRATION_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.paynowIntegrationIdZig }}
  PAYNOW_INTEGRATION_ID_ZIG: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.paynowIntegrationKeyZig }}
  PAYNOW_INTEGRATION_KEY_ZIG: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.smtpPassword }}
  SMTP_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- /*
    Keys the HMAC over signup verification codes (src/lib/email/verification.ts).
    Optional: unset, the key is derived from AUTH_SECRET via HKDF, which every
    install already has. Set it to rotate code hashing independently of that
    secret — note that doing so invalidates every code currently in flight,
    which is a few minutes of failed signups, not a data loss.
  */}}
  {{- with .Values.secrets.emailVerificationSecret }}
  EMAIL_VERIFICATION_SECRET: {{ . | quote }}
  {{- end }}
  {{- /*
    Turnstile's server-side half. The site key is NOT here — it is inlined
    into the client bundle at image build time (see the Dockerfile's
    NEXT_PUBLIC_TURNSTILE_SITE_KEY build arg), so setting it at runtime has no
    effect at all.
  */}}
  {{- with .Values.secrets.turnstileSecretKey }}
  TURNSTILE_SECRET_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
