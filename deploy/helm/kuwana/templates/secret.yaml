{{- if .Values.secrets.create }}
# Development / evaluation only.
#
# Values rendered here come from a values file, which means they exist in
# plaintext in Git history, in `helm get values`, and in every CI log that
# echoes the command. Production installs should use externalSecret.enabled
# (External Secrets Operator) or existingSecret (sealed-secrets / SOPS).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kuwana.fullname" . }}
  labels:
    {{- include "kuwana.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.postgresql.enabled }}
  DATABASE_URL: {{ required "secrets.databaseUrl is required unless postgresql.enabled=true" .Values.secrets.databaseUrl | quote }}
  {{- end }}
  SUPABASE_SERVICE_ROLE_KEY: {{ required "secrets.supabaseServiceRoleKey is required" .Values.secrets.supabaseServiceRoleKey | quote }}
  ANTHROPIC_API_KEY: {{ required "secrets.anthropicApiKey is required" .Values.secrets.anthropicApiKey | quote }}
  # Shared bearer token the CronJobs present to /api/cron/*. Generated on
  # first install and then held stable across upgrades by reading the existing
  # Secret back — regenerating it every upgrade would break every scheduled
  # job until the next rollout caught up.
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (include "kuwana.fullname" .) }}
  {{- $current := "" }}
  {{- if and $existing $existing.data (hasKey $existing.data "CRON_SECRET") }}
  {{- $current = index $existing.data "CRON_SECRET" | b64dec }}
  {{- end }}
  CRON_SECRET: {{ default (default (randAlphaNum 48) $current) .Values.secrets.cronSecret | quote }}
{{- end }}
