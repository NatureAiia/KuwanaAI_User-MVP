{{- if .Values.externalSecret.enabled }}
# Requires the External Secrets Operator (external-secrets.io) in the cluster.
# The operator materialises a Secret named below from the configured store;
# nothing secret ever enters this repository or the Helm release values.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "kuwana.fullname" . }}
  labels:
    {{- include "kuwana.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ include "kuwana.secretName" . }}
    creationPolicy: Owner
    # Rotating a secret in the vault updates this Secret, but running pods
    # keep the env they started with — env vars are snapshotted at container
    # start. Pair a rotation with `kubectl rollout restart deploy/...`, or add
    # a reloader controller.
    template:
      type: Opaque
  data:
    {{- toYaml .Values.externalSecret.data | nindent 4 }}
{{- end }}
