apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kuwana.fullname" . }}
  labels:
    {{- include "kuwana.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  PORT: {{ .Values.service.targetPort | quote }}
  HOSTNAME: "0.0.0.0"
  NEXT_TELEMETRY_DISABLED: "1"
  ADMIN_EMAILS: {{ .Values.config.adminEmails | quote }}
  # MinIO (self-hosted S3-compatible Storage — see src/lib/storage/minio.ts).
  # Non-secret half only; MINIO_ACCESS_KEY/MINIO_SECRET_KEY live in the Secret.
  #
  # Defaulted to the Service this chart deploys (minio.yaml) when
  # minio.enabled=true and left unset here — same reasoning as the composed
  # DATABASE_URL in postgres.yaml, so nothing has to hand-maintain a hostname
  # pointing at a Service this same chart named. Pointing at an external MinIO
  # instead means setting these explicitly (and minio.enabled=false).
  {{- $minioEndpoint := .Values.config.minioEndpoint }}
  {{- if and (not $minioEndpoint) .Values.minio.enabled }}
  {{- $minioEndpoint = printf "http://%s:9000" (include "kuwana.minioFullname" .) }}
  {{- end }}
  MINIO_ENDPOINT: {{ $minioEndpoint | quote }}
  {{- $minioBucket := .Values.config.minioBucket }}
  {{- if and (not $minioBucket) .Values.minio.enabled }}
  {{- $minioBucket = "kuwana" }}
  {{- end }}
  MINIO_BUCKET: {{ $minioBucket | quote }}
  {{- with .Values.config.minioPublicUrl }}
  MINIO_PUBLIC_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.minioRegion }}
  MINIO_REGION: {{ . | quote }}
  {{- end }}
  {{- /*
    Auth.js (NextAuth v5). AUTH_SECRET lives in the Secret; AUTH_URL is
    optional — trustHost's Host-header inference covers most deployments
    without it (see src/lib/nextAuth.ts).
  */}}
  {{- with .Values.config.authUrl }}
  AUTH_URL: {{ . | quote }}
  {{- end }}
  # The pool size the application actually applies. The `connection_limit`
  # parameter on the database URL is Prisma-engine syntax that the Prisma 7
  # `pg` driver adapter does not read — src/lib/prismaAdapter.ts sets
  # `Pool({ max })` from this variable instead. Both come from the same
  # `database.connectionLimit` value so the render-time budget check in
  # _helpers.tpl stays a true statement about what pods will open.
  DATABASE_POOL_MAX: {{ .Values.database.connectionLimit | quote }}
  {{- /*
    Signup email verification (src/lib/email/mailer.ts). Non-secret half only
    — SMTP_PASSWORD and EMAIL_VERIFICATION_SECRET live in the Secret.

    Emitted only when set, because "no SMTP host" is a supported state that
    means verification is not in force. A blank string here would be read as
    configured-and-broken instead, which is the harder failure to diagnose.
  */}}
  {{- with .Values.config.smtpHost }}
  SMTP_HOST: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.smtpPort }}
  SMTP_PORT: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.smtpUser }}
  SMTP_USER: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.emailFrom }}
  EMAIL_FROM: {{ . | quote }}
  {{- end }}
  {{- /*
    Hops in front of the app that append to x-forwarded-for. Decides which
    entry src/lib/rateLimit.ts trusts as the caller — set too low, a client
    can inject its own hop and walk past every IP-keyed rate limit.
  */}}
  {{- with .Values.config.trustedProxyCount }}
  TRUSTED_PROXY_COUNT: {{ . | quote }}
  {{- end }}
