{{- if .Values.podDisruptionBudget.enabled }}
# Bounds voluntary disruption only — node drains, cluster upgrades, descheduler
# evictions. It does not protect against a node failing outright; that is what
# the topology spread constraints are for.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kuwana.fullname" . }}
  labels:
    {{- include "kuwana.labels" . | nindent 4 }}
spec:
  {{- if .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- else if .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kuwana.selectorLabels" . | nindent 6 }}
{{- end }}
