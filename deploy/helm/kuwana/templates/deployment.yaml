{{- include "kuwana.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kuwana.fullname" . }}
  labels:
    {{- include "kuwana.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if and (not .Values.autoscaling.enabled) (not .Values.keda.enabled) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the current capacity mid-deploy; add one pod, wait
      # for it to pass readiness, then retire an old one.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "kuwana.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kuwana.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        # Roll the pods when config or secret content changes. Without these,
        # `helm upgrade` updates the ConfigMap and the running pods keep
        # serving the previous values indefinitely.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.secrets.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kuwana.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: web
          image: {{ include "kuwana.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "kuwana.fullname" . }}
            - secretRef:
                name: {{ include "kuwana.secretName" . }}
          env:
            {{- include "kuwana.databaseEnv" . | nindent 12 }}
            {{- include "kuwana.redisEnv" . | nindent 12 }}
            - name: APP_VERSION
              value: {{ default .Chart.AppVersion .Values.image.tag | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Startup gates the other two: a cold Next.js server plus a first
          # Prisma connection can take longer than a liveness period, and
          # without this the pod would be killed while it was still booting.
          startupProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Endpoint removal propagates asynchronously; exiting
                # immediately drops requests the ingress has already routed.
                command: ["sleep", "{{ .Values.preStopSleepSeconds }}"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Required because the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 512Mi
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
