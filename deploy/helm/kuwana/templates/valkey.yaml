{{- if .Values.valkey.enabled }}
{{- $name := include "kuwana.valkeyFullname" . -}}
{{- $auth := .Values.valkey.auth -}}
{{/*
Password is generated once and then read back from the live Secret on every
subsequent render, exactly as the Postgres one is — rotating it on upgrade
would leave running pods holding a password the server no longer accepts.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $stored := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "password") -}}
{{- $stored = index $existing.data "password" | b64dec -}}
{{- end -}}
{{- $password := default (default (randAlphaNum 32) $stored) $auth.password -}}
{{- if not $auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kuwana.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
type: Opaque
stringData:
  password: {{ $password | quote }}
  # Composed here so no one has to hand-maintain a URL pointing at a Service
  # this chart named.
  redis-url: {{ printf "redis://:%s@%s:6379" $password $name | quote }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "kuwana.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
data:
  valkey.conf: |
    # This instance holds a regenerable cache and short-lived rate-limit
    # counters. Nothing in it is a source of truth, so it is configured to
    # bound its memory and evict rather than to never lose a key.
    maxmemory {{ .Values.valkey.maxmemory }}
    maxmemory-policy {{ .Values.valkey.maxmemoryPolicy }}
    # Persistence off by default: an empty cache after a restart costs one
    # slow request per key, while an AOF/RDB write amplifies every cache set
    # into disk I/O for data that is worthless a minute later.
    save ""
    appendonly {{ ternary "yes" "no" .Values.valkey.persistence.enabled }}
    # Renamed rather than left available: a stray FLUSHALL from anything with
    # network access wipes the cache of every pod at once.
    rename-command FLUSHALL ""
    rename-command FLUSHDB ""
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "kuwana.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  clusterIP: None
  ports:
    - port: 6379
      targetPort: valkey
      name: valkey
  selector:
    app.kubernetes.io/name: {{ include "kuwana.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: valkey
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "kuwana.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  serviceName: {{ $name }}
  # Single instance, no replication. Losing it costs a cold cache and a reset
  # rate-limit window — both self-healing. If this ever holds anything whose
  # loss is not self-healing, that assumption has to be revisited.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kuwana.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: valkey
  template:
    metadata:
      labels:
        {{- include "kuwana.labels" . | nindent 8 }}
        app.kubernetes.io/component: valkey
      annotations:
        # Hashes the config inputs, not this template's own output — the
        # ConfigMap lives in this same file, so rendering it here to hash it
        # would recurse forever.
        checksum/config: {{ .Values.valkey | toYaml | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: {{ .Values.valkey.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - valkey-server
            - /etc/valkey/valkey.conf
            - --requirepass
            - $(VALKEY_PASSWORD)
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default $name $auth.existingSecret }}
                  key: password
          ports:
            - name: valkey
              containerPort: 6379
          livenessProbe:
            # `valkey-cli ping` without auth returns NOAUTH, which is still
            # proof the server is answering — but exec probes that print
            # errors muddy debugging, so the password is passed explicitly.
            exec:
              command: ["sh", "-c", "valkey-cli -a \"$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli -a \"$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/valkey
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        {{- if not .Values.valkey.persistence.enabled }}
        - name: data
          emptyDir:
            sizeLimit: {{ .Values.valkey.persistence.size }}
        {{- end }}
  {{- if .Values.valkey.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.valkey.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.valkey.persistence.size }}
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "kuwana.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kuwana.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: valkey
  policyTypes:
    - Ingress
  ingress:
    # Only the web pods. Valkey's own auth is a second layer, not the first —
    # an unauthenticated cache reachable from the whole namespace is how one
    # compromised sidecar reads every cached response in the cluster.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: web
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
