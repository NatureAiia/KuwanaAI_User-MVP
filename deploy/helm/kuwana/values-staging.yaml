# Staging overlay.
#
# Runs the in-cluster Postgres so staging can be torn down and rebuilt without
# touching a managed database, and so the StatefulSet path stays exercised
# rather than rotting untested. Supabase Auth is still the hosted service —
# it is the identity provider, not something this chart can stand up.
#
#   helm upgrade --install kuwana deploy/helm/kuwana \
#     -n kuwana-staging --create-namespace \
#     -f deploy/helm/kuwana/values-staging.yaml \
#     --set image.tag=<sha> --set migrations.image.tag=<sha>

replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 768Mi

podDisruptionBudget:
  # A PDB of 50% on 2 replicas blocks node drains during cluster maintenance
  # for no benefit in a non-production environment.
  enabled: false

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # Staging is not for the public or for search engines.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Robots-Tag: noindex, nofollow";
  hosts:
    - host: staging.kuwana.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: kuwana-staging-tls
      hosts:
        - staging.kuwana.example.com

config:
  adminEmails: "arthur@rubiem.com"
  # minioEndpoint deliberately unset: it defaults to this release's in-cluster
  # MinIO Service (minio.enabled=true below is really just the chart default,
  # restated for clarity) rather than to a hand-written hostname that has to
  # be kept in sync with whatever `helm install` named the release.
  minioBucket: "kuwana-staging"
  minioPublicUrl: "https://storage.staging.kuwana.example.com"

# Secrets still come from a Secret created out of band — staging holds a real
# Anthropic credential, which costs real money if leaked. MinIO's own root
# credentials are NOT listed here: with minio.enabled=true (the chart
# default) minio.yaml generates and owns them, the same way postgresql.enabled
# owns DATABASE_URL — this Secret only needs to cover what the chart cannot
# generate for itself.
#   kubectl -n kuwana-staging create secret generic kuwana-app \
#     --from-literal=AUTH_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=ANTHROPIC_API_KEY=... \
#     --from-literal=CRON_SECRET="$(openssl rand -hex 32)"
existingSecret: "kuwana-app"

postgresql:
  enabled: true
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  backup:
    enabled: false

# minio.enabled stays at the chart default (true) — restated here only to
# override the public S3 Ingress hostname, which staging needs its own of.
minio:
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-staging
      # Same reasoning as the app's own Ingress above: staging buckets are not
      # for search engines either.
      nginx.ingress.kubernetes.io/configuration-snippet: |
        more_set_headers "X-Robots-Tag: noindex, nofollow";
    hosts:
      - host: storage.staging.kuwana.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: kuwana-staging-minio-tls
        hosts:
          - storage.staging.kuwana.example.com

cronJobs:
  enabled: true
