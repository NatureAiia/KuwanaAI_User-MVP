# Local stack: Postgres + migrations + the production image.
#
#   cp .env.example .env      # fill in Auth.js, MinIO, and Anthropic values
#   docker compose up --build
#   docker compose --profile seed up seed     # once, to load catalog data
#
# The Claude API is always the real hosted service; Auth.js and MinIO can
# point at whatever's configured in .env (a local MinIO container, a
# self-hosted one, etc. — this compose file doesn't run one for you). Only
# Postgres is local. DATABASE_URL is overridden below to point at that
# container, so whatever is in .env for it is ignored here on purpose.

name: kuwana

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kuwana
      POSTGRES_PASSWORD: kuwana_local_dev
      POSTGRES_DB: kuwana
    ports:
      # Exposed so `npx prisma studio` and psql work from the host.
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -U/-d matter: bare `pg_isready` reports ready while the init scripts
      # are still creating the database, and the migration then races it.
      test: ["CMD-SHELL", "pg_isready -U kuwana -d kuwana"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://kuwana:kuwana_local_dev@postgres:5432/kuwana
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runner
      args:
        APP_VERSION: local
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://kuwana:kuwana_local_dev@postgres:5432/kuwana
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - next-cache:/app/.next/cache
    security_opt:
      - no-new-privileges:true

  # One-shot catalog seed. Not in the default up path — it is destructive to
  # re-run against a database that already has curated data.
  seed:
    profiles: ["seed"]
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://kuwana:kuwana_local_dev@postgres:5432/kuwana
    command: ["npm", "run", "db:seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres-data:
  next-cache:
